spring:
  application:
    name: library-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/life_catalogue_v2}
    username: ${DB_USERNAME:library_user}
    password: ${DB_PASSWORD:library_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

book-metadata:
  google-books:
    api-key: ${GOOGLE_BOOKS_API_KEY:}

igdb:
  client-id: ${IGDB_CLIENT_ID:}
  access-token: ${IGDB_ACCESS_TOKEN:}

tmdb:
  api-token: ${TMDB_API_TOKEN:}
