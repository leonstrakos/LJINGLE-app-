services:
  database:
    image: postgres:17-alpine
    container_name: life-catalogue-v2-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-life_catalogue_v2}
      POSTGRES_USER: ${DB_USERNAME:-library_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library_password}
    ports:
      - "5432:5432"
    volumes:
      - life_catalogue_v2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: life-catalogue-v2-backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-life_catalogue_v2}
      DB_USERNAME: ${DB_USERNAME:-library_user}
      DB_PASSWORD: ${DB_PASSWORD:-library_password}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_ACCESS_TOKEN: ${IGDB_ACCESS_TOKEN:-}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  life_catalogue_v2_postgres_data:
