        font-weight: 700;
        letter-spacing: -2px;
      }
      .subtitle {
        fill: #6F6A61;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 23px;
      }
      .meta {
        fill: #6F6A61;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .section {
        fill: #6F6A61;
        font-family: Arial, Helvetica, sans-serif;
