    class="gold"
  />

  <text x="150" y="116" class="kicker">ENTRY · LJINGLE</text>

  <text x="150" y="255" class="title">ovo je bitno</text>
  <text x="150" y="352" class="subtitle">NOTE</text>

  <text x="150" y="454" class="meta">
    1 OBJECTS · 0 RELATIONS · 0 IMAGES · 0 AUDIO
  </text>

  <text x="150" y="486" class="section">CONNECTIONS</text>

  
  
        <line x1="150" y1="500" x2="980" y2="500" class="hairline"/>
        <text x="150" y="544" class="empty">No direct graph connections in this portable object.</text>
      

  <line x1="150" y1="1242" x2="980" y2="1242" class="hairline"/>

  <text x="150" y="1287" class="footer">STABLE PROVENANCE · DIRECTED GRAPH</text>
  <text x="980" y="1287" text-anchor="end" class="footer">.LJINGLE</text>
