<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1080"
  height="1350"
  viewBox="0 0 1080 1350"
>
  <defs>
    <style>
      .bg { fill: #F2EEE5; }
