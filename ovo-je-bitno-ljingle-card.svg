        font-size: 18px;
        font-style: italic;
      }
      .empty {
        fill: #8A8378;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
      }
      .footer {
        fill: #6F6A61;
        font-family: Arial, Helvetica, sans-serif;
